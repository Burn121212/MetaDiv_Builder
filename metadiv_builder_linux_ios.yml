name: metadiv
channels:
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.12.7
  - pip

  # Scientific stack used by MetaDiv Builder
  - numpy=1.26.4
  - pandas=2.2.2
  - pyarrow=16.1.0
  - openpyxl=3.1.5

  # Jupyter / notebook execution
  - jupyterlab
  - notebook
  - ipykernel

  # Utilities commonly used by the pipeline
  - requests
  - pyyaml
  - beautifulsoup4
  - html5lib

  # Optional but useful for exploratory plots
  - matplotlib

  # Excel / compressed file support handled by Python packages above
